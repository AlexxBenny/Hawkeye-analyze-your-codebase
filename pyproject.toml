[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawkeye-analyzer"
version = "0.6.0"
description = "Architectural intelligence for AI coding agents — one call gives your editor full context before it edits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alex"}]
keywords = ["dependency", "architecture", "mcp", "static-analysis", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.0",
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
python-only = []  # pip install hawkeye-analyzer[python-only] — no tree-sitter, Python analysis only
dev = ["pytest", "isort", "black"]

[project.scripts]
hawkeye = "hawkeye.cli:main"
hawkeye-mcp = "hawkeye.server.mcp:main"

[project.urls]
Homepage = "https://github.com/AlexxBenny/Hawkeye-analyze-your-codebase"
Repository = "https://github.com/AlexxBenny/Hawkeye-analyze-your-codebase"
Changelog = "https://github.com/AlexxBenny/Hawkeye-analyze-your-codebase/blob/main/CHANGELOG.md"
Issues = "https://github.com/AlexxBenny/Hawkeye-analyze-your-codebase/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hawkeye*"]

[tool.setuptools.package-data]
hawkeye = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
